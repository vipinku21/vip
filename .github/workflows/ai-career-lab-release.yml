name: Publish AI Career Lab pilot
on:
  push:
    tags:
      - 'career-lab-pilot-v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-career-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: python deploy/package_release.py ai-career-lab-pilot.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pilot
          path: ai-career-lab/ai-career-lab-pilot.tar.gz
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pilot
      - name: Publish the tagged package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ai-career-lab-pilot.tar.gz --repo "$GITHUB_REPOSITORY" --verify-tag --title "AI Career Lab pilot" --notes "Invitation-only pilot with private learner accounts and text and voice résumé interviews."

